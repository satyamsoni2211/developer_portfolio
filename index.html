    <style>
      /* Critical CSS for initial load */
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #00ff00;
        font-family: 'Courier New', Courier, monospace;
      }
      
      /* Preload animation */
      #preload {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      #preload.hidden {
        display: none;
      }
      
      .preload-text {
        color: #00ff00;
        font-size: 14px;
        animation: pulse 1s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="preload">
      <div class="preload-text">Initializing terminal...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide preload when app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('preload').classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
